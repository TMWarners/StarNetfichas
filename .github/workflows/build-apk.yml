name: Compilar APK StarNet

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Descomprimir proyecto
        run: |
          unzip -q StarNetFichas-v1.zip
          echo "Contenido del proyecto:"
          ls -la StarNetFichas

      - name: Compilar APK
        working-directory: StarNetFichas
        run: |
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: StarNetFichas-APK
          path: StarNetFichas/app/build/outputs/apk/debug/app-debug.apk
