name: Compilar APK StarNet

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Descomprimir proyecto
        run: |
          unzip -q StarNetFichas-v1.zip
          echo "Contenido del proyecto:"
          ls -la StarNetFichas

      - name: Corregir MainActivity
        run: |
          python3 - <<'PY'
          p = "StarNetFichas/app/src/main/java/com/starnet/fichas/MainActivity.java"

          with open(p, "r", encoding="utf-8") as f:
              s = f.read()

          s = s.replace(
              'runOnUiThread(()->{status.setText(msg); create.setEnabled(true);});',
              'final String finalMsg = msg; runOnUiThread(()->{status.setText(finalMsg); create.setEnabled(true);});'
          )

          with open(p, "w", encoding="utf-8") as f:
              f.write(s)

          print("MainActivity corregido")

      - name: Compilar APK
        working-directory: StarNetFichas
        run: |
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: StarNetFichas-APK
          path: StarNetFichas/app/build/outputs/apk/debug/app-debug.apk
